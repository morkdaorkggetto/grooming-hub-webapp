<!doctype html><html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen','Ubuntu','Cantarell','Fira Sans','Droid Sans','Helvetica Neue', sans-serif}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.chip{min-width:0;min-height:54px;padding:6px 4px;border:1px solid #999;border-radius:12px;background:#fff;font-family:inherit;font-size:12.5px;font-weight:600;white-space:normal;text-align:center}
.chip small{display:block;margin-top:2px;font-size:9px;font-weight:700;line-height:1.1;text-transform:uppercase}
.chip[aria-pressed=true]{border:2px solid #000}
.probe{position:absolute;white-space:nowrap;visibility:hidden}
</style></head><body>
<div id="w351" style="width:351px"><div class="row"><button class="chip">Mattina (9–13)</button><button class="chip">Pomeriggio (13–19)</button><button class="chip">Per me è uguale</button></div>
<div class="row"><button class="chip" disabled>Mattina (9–13)<small>Non disponibile</small></button><button class="chip" aria-pressed="true">Pomeriggio (13–19)</button><button class="chip" aria-pressed="true">Per me è uguale</button></div>
<div class="row"><button class="chip">Mattina (9–13)</button><button class="chip" disabled>Pomeriggio (13–19)<small>Non disponibile</small></button><button class="chip">Per me è uguale</button></div></div>
<div id="w303" style="width:303px"><div class="row"><button class="chip">Mattina (9–13)</button><button class="chip">Pomeriggio (13–19)</button><button class="chip">Per me è uguale</button></div>
<div class="row"><button class="chip" disabled>Mattina (9–13)<small>Non disponibile</small></button><button class="chip" aria-pressed="true">Pomeriggio (13–19)</button><button class="chip" aria-pressed="true">Per me è uguale</button></div>
<div class="row"><button class="chip">Mattina (9–13)</button><button class="chip" disabled>Pomeriggio (13–19)<small>Non disponibile</small></button><button class="chip">Per me è uguale</button></div></div>
<script>
Promise.all(["500 11.5px Roboto","600 12.5px Roboto","700 13px Roboto"].map(f=>document.fonts.load(f).catch(e=>[]))).then(async(ld)=>{await document.fonts.ready;window.__ld=ld.map(x=>x.length);
 const out={loaded:window.__ld,font:getComputedStyle(document.body).fontFamily.split(',')[0], roboto:document.fonts.check("600 12.5px Roboto"), rows:[], probes:{}};
 for(const id of ['w351','w303']) for(const row of document.querySelectorAll('#'+id+' .row')){
  const r=[];for(const b of row.children){const rg=document.createRange();rg.selectNodeContents(b);const tops=[...new Set([...rg.getClientRects()].map(x=>Math.round(x.top)))];
   const tn=b.firstChild;const r2=document.createRange();r2.selectNodeContents(tn);const lt=[...new Set([...r2.getClientRects()].map(x=>Math.round(x.top)))];
   r.push({t:b.textContent,w:+b.getBoundingClientRect().width.toFixed(2),h:+b.getBoundingClientRect().height.toFixed(2),righeEtichetta:lt.length,righeTot:tops.length,esce:b.scrollWidth>b.clientWidth})}
  out.rows.push({id,r});}
 const P=(txt,css)=>{const s=document.createElement('span');s.className='probe';s.style.cssText=css;s.textContent=txt;document.body.appendChild(s);return +s.getBoundingClientRect().width.toFixed(2)};
 const n='font-size:12.5px;font-weight:600', h='font-size:11.5px;font-weight:500', s='font-size:11.5px;font-weight:600', t='font-size:13px;font-weight:700';
 for(const x of ['Mattina','Pomeriggio','Per me','è uguale','Per me è uguale','Mattina (9–13)','Pomeriggio (13–19)','Mattina chiusa','Pomeriggio chiuso']) out.probes['nome · '+x]=P(x,n);
 for(const x of ['9–13','13–19']) out.probes['ore · '+x]=P(x,h);
 for(const x of ['chiusa','chiuso','chiusa il lunedì','chiuso il mercoledì','chiuso la domenica','chiuso il mer']) out.probes['stato · '+x]=P(x,s);
 out.probes['titolo · Mattina o pomeriggio? (facoltativo)']=P('Mattina o pomeriggio? (facoltativo)',t);
 const d=document.createElement('pre');d.id='m';d.textContent=JSON.stringify(out);document.body.appendChild(d)});
</script></body></html>
