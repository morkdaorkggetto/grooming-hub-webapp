<template id="__bundler_thumbnail">

</template>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared-ui.jsx"></script>
<script type="text/babel" src="gh15-ed-kit.jsx"></script>
<script type="text/babel" src="gh15-ed-riferimenti.jsx"></script>
<script type="text/babel" src="cd01-cal-note.jsx"></script>

<script type="text/babel" src="cd10-tessera-kit.jsx"></script>
<script type="text/babel" src="cd10-tessera-note.jsx"></script>
<script type="text/babel" data-presets="react">
const C = ({ children }) => <div style={{ width: '100%', height: '100%', display: 'grid', placeItems: 'center', background: '#f0eee9' }}>{children}</div>;
const S10 = {
  nina: { pet: 'Nina', breed: 'Shih Tzu', done: 3, of: 4, dal: '6 marzo 2026' },
  pepe: { pet: 'Pepe', breed: 'Barboncino', done: 1, of: 4, dal: '6 marzo 2026' },
  luna: { pet: 'Luna', breed: 'Barboncino', tier: 'bronze', done: 6, of: 12, win: 24, carry: true, foto: true },
  kira: { pet: 'Kira', breed: 'Maltese', tier: 'gold', done: 41, of: 36, win: 36 },
};
const HomeGhost = ({ label, h }) => (
  <div style={{ height: h, borderRadius: 18, border: `1px dashed ${GH.bd}`, display: 'grid', placeItems: 'center', fontSize: 11, color: GH.mute }}>{label}</div>
);
const Home10 = () => (
  <div style={{ width: 375, height: 812, borderRadius: 28, overflow: 'hidden', background: GH.page, boxShadow: '0 18px 44px rgba(43,37,37,.16)', fontFamily: 'var(--font-sans)', display: 'flex', flexDirection: 'column' }}>
    <div style={{ height: 24 }}/>
    <div style={{ padding: '6px 16px 14px', textAlign: 'center' }}>
      <div style={{ fontSize: 18, color: GH.ink, ...GH.serifL }}>ZavaRoby pet station</div>
      <div style={{ fontSize: 25, color: GH.ink, marginTop: 14, ...GH.serifL }}>Buongiorno, Chiara</div>
    </div>
    <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 12 }}>
      <HomeGhost label="prossimo appuntamento · invariato" h={96}/>
      <HomeStrip10 s={S10.nina}/>
      <HomeStrip10 s={S10.luna}/>
      <HomeGhost label="i cani · invariato" h={96}/>
    </div>
    <TabBar/>
  </div>
);
const App = () => (
  <DesignCanvas>
    <DCSection id="cd10-vero" title="CD-10 · Prima, misurato sul vero" subtitle="Le schermate di GH-107 con sopra le misure. Rosso: dove la tessera vera devia dalla griglia — 6, 7 e 8 sono miei, 1–5 dell’esecuzione.">
      <DCArtboard id="misure" label="375 e 320 · le nove misure" width={1280} height={720}><CD10_Misure/></DCArtboard>
    </DCSection>
    <DCSection id="cd10-norma" title="CD-10 · Lo stato normale: niente ritratto, pochi timbri" subtitle="Zero cerchi. Senza foto il ritratto non c’è e la tessera comincia dal nome; i timbri sono caselle numerate a larghezza piena. Il Bronzo oggi è a quattro.">
      <DCArtboard id="n375" label="375 · Nina, 3 di 4 — l’ultimo passo" width={455} height={880}><C><Pagina10 s={S10.nina} invito/></C></DCArtboard>
      <DCArtboard id="n320" label="320 · stessa tessera, titolo al centro" width={400} height={880}><C><Pagina10 s={S10.nina} w={320} invito/></C></DCArtboard>
      <DCArtboard id="p375" label="375 · Pepe, 1 di 4 — la maggioranza" width={455} height={880}><C><Pagina10 s={S10.pepe}/></C></DCArtboard>
    </DCSection>
    <DCSection id="cd10-altri" title="CD-10 · Con ritratto, all’Oro, su schermo largo, in Home" subtitle="Con la foto il ritratto è un riquadro 88×88, il livello un filo di metallo attorno. La modalità banco non è toccata.">
      <DCArtboard id="luna" label="375 · Luna, Bronzo con ritratto" width={455} height={880}><C><Pagina10 s={S10.luna}/></C></DCArtboard>
      <DCArtboard id="kira" label="375 · Kira, Oro — niente timbri" width={455} height={880}><C><Pagina10 s={S10.kira}/></C></DCArtboard>
      <DCArtboard id="wide" label="1365 · centrata in 390" width={1365} height={760}><Pagina10 s={S10.nina} w={1365} h={760} invito/></DCArtboard>
      <DCArtboard id="home" label="375 · la striscia in Home, senza cerchio" width={455} height={880}><C><Home10/></C></DCArtboard>
    </DCSection>
    <DCSection id="cd10-ragioni" title="CD-10 · Le ragioni e i valori" subtitle="La tabella dei valori è quella che Codex trasforma nel mandato.">
      <DCArtboard id="cerchi" label="Meno cerchi · il numero dei timbri non è fisso" width={1280} height={640}><CD10_Cerchi/></DCArtboard>
      <DCArtboard id="valori" label="La griglia · la regola · i tre scostamenti" width={1280} height={820}><CD10_Valori/></DCArtboard>
      <DCArtboard id="nontorna" label="Cosa non torna · cosa resta" width={1280} height={700}><CD10_NonTorna/></DCArtboard>
    </DCSection>
    <DCPostIt x={44} y={44} width={330}>
      <strong>CD-10 · La tessera, rivista sul vero</strong><br/><br/>
      <strong>Da sei cerchi a zero</strong> sullo stato normale. Senza foto il ritratto non c’è: la tessera comincia dal nome, a 40px. Con la foto, un riquadro 88×88.<br/><br/>
      <strong>I timbri sono caselle numerate</strong> a larghezza piena: restano timbri, e la fila non si allunga quando la soglia sale da 4 a 6.<br/><br/>
      <strong>La regola su due righe decise</strong>, la data non si spezza.<br/><br/>
      <strong>«Mostra al banco»</strong>: primary-hover, 19px/700, 54px, senza sottotitolo.<br/><br/>
      <strong>Testata simmetrica 44 | 1fr | 44</strong>: il titolo resta al centro anche a 320.<br/><br/>
      <strong>Da leggere:</strong> «Cosa non torna», 1 — il 7 novembre il Bronzo si allontana a chi è all’ultimo passo.
    </DCPostIt>
  </DesignCanvas>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
