<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<title>CD-02 · Il report incassi · composizione</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #root { width: 100vw; height: 100vh; overflow: hidden; }
  em { font-style: italic; }
  a { color: var(--color-link); }
  a:hover { color: var(--color-primary-hover); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg"><rect width="240" height="160" fill="#6f9792"/><rect x="70" y="44" width="100" height="72" rx="12" fill="#fbf6f3"/><rect x="80" y="58" width="52" height="10" rx="5" fill="#2b2525"/><rect x="80" y="80" width="80" height="8" rx="4" fill="rgba(111,151,146,.3)"/><rect x="80" y="92" width="56" height="8" rx="4" fill="rgba(111,151,146,.3)"/><rect x="80" y="104" width="34" height="8" rx="4" fill="rgba(111,151,146,.3)"/></svg>
</template>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared-ui.jsx"></script>
<script type="text/babel" src="gh15-ed-kit.jsx"></script>
<script type="text/babel" src="gh15-ed-riferimenti.jsx"></script>
<script type="text/babel" src="cd01-cal-note.jsx"></script>
<script type="text/babel" src="cd02-report-kit.jsx"></script>
<script type="text/babel" src="cd02-report-viste.jsx"></script>
<script type="text/babel" src="cd02-report-note.jsx"></script>

<script type="text/babel" data-presets="react">
  const Center = ({ children }) => (
    <div style={{ width: '100%', height: '100%', display: 'grid', placeItems: 'center', background: '#f0eee9' }}>{children}</div>
  );
  const App = () => (
    <DesignCanvas>
      <DCSection
        id="cd02-estremi"
        title="CD-02 · I due estremi, composti per primi"
        subtitle="Come chiede il brief: prima la settimana da 1 visita e quella da 58, poi la media. Chi compone sulla media costruisce una pagina che si rompe due volte su tre."
      >
        <DCArtboard id="una" label="Desktop 1280 · la settimana da 1 visita" width={1280} height={900}>
          <RepUna/>
        </DCArtboard>
        <DCArtboard id="piena" label="Desktop 1280 · la settimana da 58" width={1280} height={1390}>
          <RepPiena/>
        </DCArtboard>
        <DCArtboard id="futura" label="Desktop 1280 · la settimana futura" width={1280} height={720}>
          <RepFutura/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="cd02-media"
        title="CD-02 · La settimana media — 18 visite"
        subtitle="Due numeri grandi invece di quattro, il confronto dentro il numero, sette righe-barra al posto di sette schede più un grafico. Le righe con il fondo attenuato raccontano un’assenza, non un lavoro: restano in elenco a 0 € perché sono successe."
      >
        <DCArtboard id="media" label="Desktop 1280 · settimana media" width={1280} height={1360}>
          <RepMedia/>
        </DCArtboard>
        <DCArtboard id="mob" label="Mobile 390 · la settimana ci sta intera" width={480} height={900}>
          <Center><RepMobile/></Center>
        </DCArtboard>
        <DCArtboard id="load" label="Desktop 1280 · caricamento" width={1280} height={1200}>
          <RepLoad/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="cd02-sconti"
        title="CD-02 · Le due decisioni che cambiano la pagina"
        subtitle="Il riquadro morto e la ridondanza fra grafico e schede: entrambe erano richieste di decidere, non di rivestire."
      >
        <DCArtboard id="sconti" label="Sconti · e la fusione grafico + schede" width={1280} height={480}>
          <CD2_Sconti/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="cd02-domande"
        title="CD-02 · Le quattro domande del brief"
        subtitle="A chi parla, quale unità, il confronto mancante. La quarta — grafico e schede — è già sciolta nella tavola sopra."
      >
        <DCArtboard id="dom" label="Risposte alle domande 1, 2, 3" width={1280} height={420}>
          <CD2_Domande/>
        </DCArtboard>
        <DCArtboard id="campi" label="Campi ⚠ e domande aperte" width={1280} height={560}>
          <CD2_Campi/>
        </DCArtboard>
      </DCSection>

      <DCPostIt x={44} y={44} width={340}>
        <strong>CD-02 · Il report — composizione</strong><br/><br/>
        Vocabolario ereditato da <em>design_handoff_staff_app</em>. <strong>Nessun colore nuovo</strong>: l’arancione scritto a mano <em>#b45309</em> non è stato ricondotto a un token — <strong>è sparito insieme al riquadro che coloriva</strong>.<br/><br/>
        Tre decisioni:<br/>
        · <strong>«Sconti applicati» via dai numeri grandi.</strong> 0,00 € per 456 visite. Non perché vale zero, ma perché uno spazio che non cambia mai smette di essere letto — e trascina con sé i tre riquadri accanto. Quattro numeri diventano due.<br/>
        · <strong>La riga del giorno È la barra.</strong> Sette schede più sette barre erano lo stesso dato due volte.<br/>
        · <strong>Il confronto entra nel numero</strong>, con la settimana scorsa scritta per esteso sotto. Quando sono uguali: «come la scorsa», non «0%».<br/><br/>
        Titolo: da «Report incassi» a <strong>«Come è andata»</strong>. È l’unica pagina che parla la lingua dei numeri: che almeno usi le loro parole.<br/><br/>
        <strong>6 campi ⚠.</strong> Il più insidioso: «chiuso» e «non è passato nessuno» non sono la stessa cosa, e oggi il dato non distingue.
      </DCPostIt>
    </DesignCanvas>
  );
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
